<!doctype html><html lang=ko><head><meta charset=utf-8><title>ChapterFull</title><style>@font-face{font-family:'Asta Sans';src:url('../fonts/AstaSans[wght].ttf');font-weight:300 800}
@font-face{font-family:'Gowun Batang';src:url('../fonts/GowunBatang-Regular.ttf');font-weight:400}
@font-face{font-family:'Gowun Batang';src:url('../fonts/GowunBatang-Bold.ttf');font-weight:700}

body{margin:0}
.ruled{line-height:var(--lh);background-image:linear-gradient(to bottom,transparent calc(var(--lh) - 2px),var(--rc,#c9c7de) 0);background-size:100% var(--lh)}
.chip{font-size:22px;font-weight:700;border-radius:24px;padding:5px 16px;white-space:nowrap}
.wave{display:flex;align-items:center;gap:9px;height:110px}
.wave span{width:10px;border-radius:5px;background:#1a0bd0;animation:wv 1.2s ease-in-out infinite}
.wave span:nth-child(2n){animation-delay:.2s}
.wave span:nth-child(3n){animation-delay:.4s}
@keyframes wv{50%{transform:scaleY(.6)}}
@media (prefers-reduced-motion:reduce){.wave span{animation:none}}
.pill{height:96px;border-radius:48px;padding:0 28px;font-size:29px;font-weight:800;display:flex;align-items:center;justify-content:center;gap:12px;box-sizing:border-box;text-decoration:none;white-space:nowrap}
.off{opacity:.32}
</style></head><body style='margin:0'>
<div style="width:960px;height:1280px;box-sizing:border-box;background:#efefef;font-family:'Asta Sans','Noto Sans KR',sans-serif;color:#1a0bd0;display:grid;grid-template-columns:72px minmax(0,1fr);overflow:hidden">

        <svg width="36" height="36" viewBox="0 0 24 24" aria-hidden="true"><path d="M16.5 7v8.5a4.5 4.5 0 0 1-9 0V6a3 3 0 0 1 6 0v9.5a1.5 1.5 0 0 1-3 0V7.5" fill="none" stroke="#1a0bd0" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>여기까지
      </a>

        <a href="Driving.html" class="pill" style="height:120px;background:#1a0bd0;color:#ffffff;font-size:36px"><svg width="38" height="38" viewBox="0 0 24 24" aria-hidden="true"><path d="M5 12.5l4.5 4.5L19 7.5" fill="none" stroke="#ffffff" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"/></svg>챕터 마무리</a>
        <div style="display:flex;gap:16px">
          <a href="Interview.html" class="pill" style="flex:1;border:2.5px solid #1a0bd0;color:#1a0bd0"><svg width="30" height="30" viewBox="0 0 24 24" aria-hidden="true"><path d="M4 20h4l11-11-4-4L4 16z" fill="none" stroke="#1a0bd0" stroke-width="2.4" stroke-linejoin="round"/></svg>다음 챕터 · 일과 생계</a>

    </div>
