<!doctype html><html lang=ko><head><meta charset=utf-8><title>주행 중 인터뷰</title><style>@font-face{font-family:'Asta Sans';src:url('../fonts/AstaSans[wght].ttf');font-weight:300 800}
@font-face{font-family:'Gowun Batang';src:url('../fonts/GowunBatang-Regular.ttf');font-weight:400}
@font-face{font-family:'Gowun Batang';src:url('../fonts/GowunBatang-Bold.ttf');font-weight:700}

body{margin:0}
.ruled{line-height:var(--lh);background-image:linear-gradient(to bottom,transparent calc(var(--lh) - 2px),var(--rc,#c9c7de) 0);background-size:100% var(--lh)}
.chip{font-size:22px;font-weight:700;border-radius:24px;padding:5px 16px;white-space:nowrap}
.wave{display:flex;align-items:center;gap:14px;height:190px}
.wave span{width:16px;border-radius:8px;background:#1a0bd0;animation:wv 1.2s ease-in-out infinite}
.wave span:nth-child(2n){animation-delay:.2s}
.wave span:nth-child(3n){animation-delay:.4s}
@keyframes wv{50%{transform:scaleY(.6)}}
@media (prefers-reduced-motion:reduce){.wave span{animation:none}}
</style></head><body style='margin:0'>
<div style="width:960px;height:1280px;box-sizing:border-box;background:#efefef;font-family:'Asta Sans','Noto Sans KR',sans-serif;color:#1a0bd0;display:grid;grid-template-columns:72px minmax(0,1fr);overflow:hidden">

  <div style="border-right:2px solid #1a0bd0;display:flex;flex-direction:column;justify-content:space-between;align-items:center;padding:36px 0 28px">
    <span style="writing-mode:vertical-rl;font-size:22px;font-weight:800">김○○의 자서전</span>
    <div style="display:flex;flex-direction:column;align-items:center;gap:16px">
      <span style="writing-mode:vertical-rl;font-family:'Gowun Batang',serif;font-size:21px;font-weight:700;letter-spacing:.03em">Autography</span>
      <span aria-label="환경설정 (주행 중 사용 불가)" style="width:52px;height:52px;border-radius:26px;border:2px solid #1a0bd0;display:flex;align-items:center;justify-content:center;box-sizing:border-box;opacity:.32"><svg width="26" height="26" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="3.4" fill="none" stroke="#1a0bd0" stroke-width="2"/><path d="M12 2.5v3M12 18.5v3M2.5 12h3M18.5 12h3M5.3 5.3l2.1 2.1M16.6 16.6l2.1 2.1M5.3 18.7l2.1-2.1M16.6 7.4l2.1-2.1" stroke="#1a0bd0" stroke-width="2" stroke-linecap="round"/></svg></span>
    </div>
  </div>

  <div style="display:flex;flex-direction:column;min-width:0">
    <div style="display:flex;justify-content:space-between;align-items:center;gap:20px;padding:34px 40px 30px;border-bottom:2px solid #1a0bd0">
      <div style="display:flex;flex-direction:column;gap:14px">
        <div style="display:flex;align-items:center;gap:16px">
          <span class="chip" style="background:#1a0bd0;color:#ffffff">주행 중 · 인터뷰</span>
          <span style="font-size:22px;font-weight:700">도착까지 24분</span>
        </div>
        <span style="font-size:40px;font-weight:800">2장 첫 차 · 질문 4</span>
      </div>
      <a href="Driving.html" style="flex:none;height:104px;box-sizing:border-box;padding:0 40px 0 30px;border-radius:52px;border:2.5px solid #1a0bd0;color:#1a0bd0;display:flex;align-items:center;gap:14px;font-size:34px;font-weight:700;text-decoration:none">
        <svg width="36" height="36" viewBox="0 0 24 24" aria-hidden="true"><path d="M16.5 7v8.5a4.5 4.5 0 0 1-9 0V6a3 3 0 0 1 6 0v9.5a1.5 1.5 0 0 1-3 0V7.5" fill="none" stroke="#1a0bd0" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>여기까지
      </a>
    </div>

    <div style="padding:40px 40px 0;display:flex;flex-direction:column;gap:16px">
      <span style="font-size:24px;font-weight:700;color:#4a44a6">오토가 물었어요</span>
      <p class="ruled" style="--lh:82px;margin:0;font-family:'Gowun Batang',serif;font-size:58px;font-weight:700;letter-spacing:-.015em">처음 운전대를 잡은 날,<br>기억나세요?</p>
    </div>

    <div style="flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:22px;padding:20px 40px 60px">
      <div class="wave" aria-hidden="true">
        <span style="height:44px"></span><span style="height:92px"></span><span style="height:150px"></span><span style="height:96px"></span><span style="height:186px"></span><span style="height:140px"></span><span style="height:170px"></span><span style="height:86px"></span><span style="height:120px"></span><span style="height:48px"></span>
      </div>
      <span style="font-size:44px;font-weight:800;color:#4a44a6">듣고 있어요</span>
      <div style="width:580px;max-width:100%;height:16px;border-radius:8px;background:#c4c3d8;overflow:hidden;margin-top:36px" role="img" aria-label="2장 첫 차 62퍼센트 채워짐"><div style="width:62%;height:100%;background:#1a0bd0"></div></div>
      <span style="font-size:60px;font-weight:800;line-height:1;font-variant-numeric:tabular-nums">62%</span>
      <span style="font-size:28px;font-weight:700">‘첫 차’가 채워지고 있어요</span>
      <p style="margin:56px 0 0;font-family:'Gowun Batang',serif;font-size:36px;font-weight:700;line-height:1.5;text-align:center;color:#7a74c9">그날 아내분 이야기를<br>조금 더 들려주시면 좋겠어요.</p>
    </div>
  </div>
</div>
</body></html>
