<!doctype html><html lang=ko><head><meta charset=utf-8><title>주행 중 내 원고 듣기</title><style>@font-face{font-family:'Asta Sans';src:url('../fonts/AstaSans[wght].ttf');font-weight:300 800}
@font-face{font-family:'Gowun Batang';src:url('../fonts/GowunBatang-Regular.ttf');font-weight:400}
@font-face{font-family:'Gowun Batang';src:url('../fonts/GowunBatang-Bold.ttf');font-weight:700}

body{margin:0}
.ruled{line-height:var(--lh);background-image:linear-gradient(to bottom,transparent calc(var(--lh) - 2px),var(--rc,#c9c7de) 0);background-size:100% var(--lh)}
.chip{font-size:22px;font-weight:700;border:2px solid #1a0bd0;border-radius:24px;padding:5px 16px;white-space:nowrap}
.icb{width:84px;height:84px;border-radius:42px;border:2.5px solid #1a0bd0;background:transparent;display:flex;align-items:center;justify-content:center;padding:0;flex:none}
.think{overflow:hidden}
.think svg{animation:wiggle 1.4s ease-in-out infinite}
@keyframes wiggle{0%{transform:translateX(0) scaleY(1)}50%{transform:translateX(-10px) scaleY(.55)}100%{transform:translateX(0) scaleY(1)}}
.mic{position:relative;width:140px;height:140px;flex:none;border-radius:70px;background:#1a0bd0;box-shadow:0 0 0 26px rgba(26,11,208,.10);display:flex;align-items:center;justify-content:center}
@media (prefers-reduced-motion:reduce){.think svg{animation:none}}
</style></head><body style='margin:0'>
<div style="width:960px;height:1280px;box-sizing:border-box;background:#efefef;font-family:'Asta Sans','Noto Sans KR',sans-serif;color:#1a0bd0;display:grid;grid-template-columns:72px minmax(0,1fr);overflow:hidden">

  <div style="border-right:2px solid #1a0bd0;display:flex;flex-direction:column;justify-content:space-between;align-items:center;padding:36px 0 28px">
    <span style="writing-mode:vertical-rl;font-size:22px;font-weight:800">김○○의 자서전</span>
    <div style="display:flex;flex-direction:column;align-items:center;gap:16px">
      <span style="writing-mode:vertical-rl;font-family:'Gowun Batang',serif;font-size:21px;font-weight:700;letter-spacing:.03em">Autography</span>
      <span aria-label="환경설정 (주행 중 사용 불가)" style="width:52px;height:52px;border-radius:26px;border:2px solid #1a0bd0;display:flex;align-items:center;justify-content:center;box-sizing:border-box;opacity:.32"><svg width="26" height="26" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="3.4" fill="none" stroke="#1a0bd0" stroke-width="2"/><path d="M12 2.5v3M12 18.5v3M2.5 12h3M18.5 12h3M5.3 5.3l2.1 2.1M16.6 16.6l2.1 2.1M5.3 18.7l2.1-2.1M16.6 7.4l2.1-2.1" stroke="#1a0bd0" stroke-width="2" stroke-linecap="round"/></svg></span>
    </div>
  </div>

  <div style="display:flex;flex-direction:column;min-width:0;min-height:0">
    <div style="display:flex;justify-content:space-between;align-items:center;gap:20px;padding:32px 32px 28px;border-bottom:2px solid #1a0bd0;flex:none">
      <div style="display:flex;flex-direction:column;gap:12px">
        <span class="chip" style="align-self:flex-start;background:#1a0bd0;color:#ffffff">주행 중 · 내 원고 고치기</span>
        <span style="font-size:40px;font-weight:800">2장 첫 차</span>
      </div>
      <a href="Driving.html" style="flex:none;height:104px;box-sizing:border-box;padding:0 40px 0 30px;border-radius:52px;border:2.5px solid #1a0bd0;color:#1a0bd0;display:flex;align-items:center;gap:14px;font-size:34px;font-weight:700;text-decoration:none">
        <svg width="36" height="36" viewBox="0 0 24 24" aria-hidden="true"><path d="M16.5 7v8.5a4.5 4.5 0 0 1-9 0V6a3 3 0 0 1 6 0v9.5a1.5 1.5 0 0 1-3 0V7.5" fill="none" stroke="#1a0bd0" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>여기까지
      </a>
    </div>

    <div style="padding:30px 32px 26px;display:flex;flex-direction:column;gap:18px;border-bottom:2px solid #c4c3d8;flex:none">
      <span style="font-size:22px;font-weight:700;color:#4a44a6">오토가 읽고 있어요 · 04:12 / 11:30</span>
      <p class="ruled" style="--lh:48px;margin:0;font-family:'Gowun Batang',serif;font-size:30px;font-weight:400;opacity:.45">스물아홉에 처음 운전대를 잡았습니다. 새벽 네 시가 이렇게 조용한 줄 몰랐어요.</p>
      <p class="ruled" style="--lh:64px;margin:0;font-family:'Gowun Batang',serif;font-size:42px;font-weight:700">시동을 걸자마자 손이 떨렸죠. <span style="text-decoration:line-through;opacity:.5">1988년</span> <span style="background:#1a0bd0;color:#ffffff;padding:0 8px;border-radius:6px">1987년</span> 겨울, 아내가 보온병에 커피를 타 줬습니다.</p>
    </div>

    <div style="flex:1;min-height:0;display:flex;flex-direction:column;gap:22px;padding:28px 32px 26px">
      <div style="align-self:flex-end;max-width:78%;background:#1a0bd0;color:#ffffff;border-radius:30px 30px 8px 30px;padding:20px 26px;font-size:28px;font-weight:700;line-height:1.45">오토야, 방금 거기 고치자.<br>1988년이 아니라 1987년이었어.</div>
      <div style="display:flex;gap:14px;align-items:flex-end;max-width:84%">
        <span class="think" aria-label="오토가 고치는 중" style="flex:none;width:60px;height:60px;border-radius:30px;background:#d6d2f8;display:flex;align-items:center;justify-content:center">
          <svg width="40" height="24" viewBox="0 0 40 24" aria-hidden="true"><path d="M2 12 Q7 2 12 12 T22 12 T32 12 T42 12" fill="none" stroke="#1a0bd0" stroke-width="3" stroke-linecap="round"/></svg>
        </span>
        <div style="background:#f8f8f8;border:2px solid #c4c3d8;border-radius:30px 30px 30px 8px;padding:20px 26px;font-family:'Gowun Batang',serif;font-size:32px;font-weight:700;line-height:1.45">‘1987년 겨울’로 고쳤어요.<br>이어서 읽어 드릴게요.</div>
      </div>

      <div style="margin-top:auto;display:flex;align-items:center;justify-content:flex-end;gap:52px;padding:10px 26px 10px 0">
        <p style="margin:0;font-family:'Gowun Batang',serif;font-size:30px;font-weight:700;line-height:1.5;text-align:right">고칠 내용이 있으면<br>오토에게 말로 알려 주세요</p>
        <span class="mic" aria-label="마이크 켜짐"><svg width="58" height="58" viewBox="0 0 24 24" aria-hidden="true"><rect x="9" y="3" width="6" height="11" rx="3" fill="#ffffff"/><path d="M6 11a6 6 0 0 0 12 0M12 17v4" stroke="#ffffff" stroke-width="2" fill="none"/></svg></span>
      </div>
    </div>

    <div style="padding:22px 32px 30px;border-top:2px solid #1a0bd0;display:flex;align-items:center;gap:20px;flex:none">
      <div style="flex:1;height:12px;border-radius:6px;background:#c4c3d8;position:relative"><div style="position:absolute;left:0;top:0;bottom:0;width:38%;background:#1a0bd0;border-radius:6px"></div></div>
      <button class="icb" style="width:92px;height:92px;border-radius:46px;border-width:3.5px" aria-label="일시정지"><svg width="34" height="34" viewBox="0 0 24 24" aria-hidden="true"><rect x="6" y="5" width="4" height="14" fill="#1a0bd0"/><rect x="14" y="5" width="4" height="14" fill="#1a0bd0"/></svg></button>
      <button class="icb" aria-label="다음 문단"><svg width="32" height="32" viewBox="0 0 24 24" aria-hidden="true"><path d="M6 5l9 7-9 7z" fill="#1a0bd0"/><rect x="16" y="5" width="2.6" height="14" fill="#1a0bd0"/></svg></button>
    </div>
  </div>
</div>
</body></html>
