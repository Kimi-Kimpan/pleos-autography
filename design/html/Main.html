<!doctype html><html lang=ko><head><meta charset=utf-8><title>정차 중 홈</title><style>@font-face{font-family:'Asta Sans';src:url('../fonts/AstaSans[wght].ttf');font-weight:300 800}
@font-face{font-family:'Gowun Batang';src:url('../fonts/GowunBatang-Regular.ttf');font-weight:400}
@font-face{font-family:'Gowun Batang';src:url('../fonts/GowunBatang-Bold.ttf');font-weight:700}

body{margin:0}
.ruled{line-height:var(--lh);background-image:linear-gradient(to bottom,transparent calc(var(--lh) - 2px),var(--rc,#c9c7de) 0);background-size:100% var(--lh)}
.row{display:flex;align-items:center;gap:24px;padding:0 32px;height:140px;border-bottom:2px solid #c4c3d8;box-sizing:border-box;flex:none}
.ins{margin:0 32px;padding:0}
.num{width:64px;font-size:28px;font-weight:700;color:#4a44a6;font-variant-numeric:tabular-nums}
.ttl{flex:1;min-width:0;font-size:40px;font-weight:700;color:#1a0bd0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.meta{font-size:24px;font-weight:600;color:#4a44a6;white-space:nowrap}
.icb{width:80px;height:80px;border-radius:40px;border:2.5px solid #1a0bd0;background:transparent;display:flex;align-items:center;justify-content:center;padding:0;flex:none;cursor:pointer}
.pill{height:84px;border-radius:42px;padding:0 34px;font-family:inherit;font-size:30px;font-weight:800;display:inline-flex;align-items:center;gap:12px;cursor:pointer;box-sizing:border-box}
.pri{background:#1a0bd0;color:#ffffff;border:2.5px solid #1a0bd0}
.sec{background:transparent;color:#1a0bd0;border:2.5px solid #1a0bd0}
</style></head><body style='margin:0'>
<div style="width:960px;height:1280px;box-sizing:border-box;background:#efefef;font-family:'Asta Sans','Noto Sans KR',sans-serif;color:#1a0bd0;display:grid;grid-template-columns:72px minmax(0,1fr);overflow:hidden">

  <div style="border-right:2px solid #1a0bd0;display:flex;flex-direction:column;justify-content:space-between;align-items:center;padding:36px 0 28px">
    <span style="writing-mode:vertical-rl;font-size:22px;font-weight:800">김○○의 자서전</span>
    <div style="display:flex;flex-direction:column;align-items:center;gap:16px">
      <span style="writing-mode:vertical-rl;font-family:'Gowun Batang',serif;font-size:21px;font-weight:700;letter-spacing:.03em">Autography</span>
      <a href="Settings.html" aria-label="환경설정" style="width:52px;height:52px;border-radius:26px;border:2px solid #1a0bd0;display:flex;align-items:center;justify-content:center;box-sizing:border-box"><svg width="26" height="26" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="3.4" fill="none" stroke="#1a0bd0" stroke-width="2"></circle><path d="M12 2.5v3M12 18.5v3M2.5 12h3M18.5 12h3M5.3 5.3l2.1 2.1M16.6 16.6l2.1 2.1M5.3 18.7l2.1-2.1M16.6 7.4l2.1-2.1" stroke="#1a0bd0" stroke-width="2" stroke-linecap="round"></path></svg></a>
    </div>
  </div>

  <div style="display:flex;flex-direction:column;min-width:0;min-height:0">
    <div style="display:flex;justify-content:space-between;align-items:center;gap:20px;padding:32px 32px 54px 32px;border-bottom:2px solid #1a0bd0;flex:none">
      <div style="display:flex;flex-direction:column;gap:12px;min-width:0">
        <span style="align-self:flex-start;font-size:20px;font-weight:700;border:2px solid #1a0bd0;border-radius:22px;padding:4px 16px">정차 중 · P</span>
        <p class="ruled" style="--lh:64px;margin: 0; font-family: 'Gowun Batang',serif; font-size: 45px; font-weight: 700; letter-spacing: -.01em; color: #1a0bd0; width: 748px; height: 128px">안녕하세요 ○○님!<br>‘첫 차’ 이야기를 이어서 써 볼까요?</p>
      </div>
      
    </div>

        <button class="icb" aria-label="1장 들어보기"><svg width="32" height="32" viewBox="0 0 24 24" aria-hidden="true"><path d="M8 5l11 7-11 7z" fill="#1a0bd0"></path></svg></button>
      </div>

      <div style="flex:none;background:#f7f7f7;border-bottom:2px solid #c4c3d8;padding:30px 32px 34px;display:flex;flex-direction:column;gap:24px">
        <div style="display: flex; align-items: center; gap: 24px; font-size: 26px">
          <span class="num" style="color:#1a0bd0">02</span>
          <span style="flex:1;font-size:52px;font-weight:800;line-height:1.1">첫 차</span>
          <span class="meta">3편 · 쓰는 중</span>
        </div>
        <div style="display:flex;flex-direction:column;gap:10px;padding-left:88px">
          <div style="height:12px;border-radius:6px;background:#c4c3d8;overflow:hidden"><div style="width:45%;height:100%;background:#1a0bd0"></div></div>
          <span style="font-size: 24px; font-weight: 600; color: #4a44a6; line-height: 2.25">마지막 이야기: 처음 운전대를 잡은 날</span>
        </div>
        <div style="display:flex;gap:16px;padding-left:88px;flex-wrap:wrap">
          <a href="Interview.html" class="pill pri" style="text-decoration:none"><svg width="28" height="28" viewBox="0 0 24 24" aria-hidden="true"><path d="M4 20h4l11-11-4-4L4 16z" fill="none" stroke="#ffffff" stroke-width="2.4" stroke-linejoin="round"></path></svg>이어쓰기</a>
          <a href="Player.html" class="pill sec" style="text-decoration:none"><svg width="26" height="26" viewBox="0 0 24 24" aria-hidden="true"><path d="M8 5l11 7-11 7z" fill="#1a0bd0"></path></svg>들어보기</a>
          <a href="Script.html" class="pill sec" style="text-decoration:none"><svg width="28" height="28" viewBox="0 0 24 24" aria-hidden="true"><path d="M6 3h9l4 4v14H6z M9 11h7 M9 15h7" fill="none" stroke="#1a0bd0" stroke-width="2"></path></svg>원고 보기</a>
        </div>
      </div>

      <div class="row ins">
        <span class="num">03</span><span class="ttl">일과 생계</span><span class="meta">시작 전</span>
        <button class="icb" aria-label="3장 시작하기"><svg width="32" height="32" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 5v14M5 12h14" stroke="#1a0bd0" stroke-width="2.4"></path></svg></button>
      </div>
      <div class="row ins">
        <span class="num">04</span><span class="ttl">가족</span><span class="meta">시작 전</span>
        <button class="icb" aria-label="4장 시작하기"><svg width="32" height="32" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 5v14M5 12h14" stroke="#1a0bd0" stroke-width="2.4"></path></svg></button>
      </div>
      <div class="row ins">
        <span class="num">05</span><span class="ttl">길 위에서 만난 사람들</span><span class="meta">시작 전</span>
        <button class="icb" aria-label="5장 시작하기"><svg width="32" height="32" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 5v14M5 12h14" stroke="#1a0bd0" stroke-width="2.4"></path></svg></button>
      </div>
    </div>

    <div style="flex:none;padding:26px 32px 32px 32px;border-top:2px solid #1a0bd0">
      <div style="display:flex;align-items:center;gap:20px">
        <span style="width:84px;height:112px;flex:none;background:#f3f0ea;border:1.5px solid #1a0bd0;display:flex;flex-direction:column;justify-content:flex-end;padding:8px;box-sizing:border-box;font-size:12px;font-weight:800;line-height:1.1">Driving<br>Together</span>
        <span style="flex:1;min-width:0;display:flex;flex-direction:column;gap:4px">
          <span style="font-size:21px;font-weight:700;color:#4a44a6">오토그래피 라디오 · 재생 중</span>
          <span style="font-size:30px;font-weight:800;white-space:nowrap;overflow:hidden;text-overflow:ellipsis">짐칸 가득, 하루치의 삶</span>
          <span style="font-size:21px;font-weight:600;color:#4a44a6">이○○ 기사님 · 1톤 화물차 18년</span>
        </span>
        <button class="icb" style="width:92px;height:92px;border-radius:46px;border-width:3.5px" aria-label="일시정지"><svg width="34" height="34" viewBox="0 0 24 24" aria-hidden="true"><rect x="6" y="5" width="4" height="14" fill="#1a0bd0"></rect><rect x="14" y="5" width="4" height="14" fill="#1a0bd0"></rect></svg></button>
        <button class="icb" aria-label="다음 이야기"><svg width="32" height="32" viewBox="0 0 24 24" aria-hidden="true"><path d="M6 5l9 7-9 7z" fill="#1a0bd0"></path><rect x="16" y="5" width="2.6" height="14" fill="#1a0bd0"></rect></svg></button>
        <span style="width:2px;height:64px;background:#c4c3d8;flex:none"></span>
        <a href="Player.html" class="icb" style="box-sizing:border-box;text-decoration:none" aria-label="플레이어 펼치기"><svg width="36" height="36" viewBox="0 0 24 24" aria-hidden="true"><path d="M6 15l6-6 6 6" fill="none" stroke="#1a0bd0" stroke-width="2.6"></path></svg></a>
      </div>
    </div>
  </div>
</div>
</body></html>
