<!doctype html><html lang=ko><head><meta charset=utf-8><title>정차 중 원고 보기</title><style>@font-face{font-family:'Asta Sans';src:url('../fonts/AstaSans[wght].ttf');font-weight:300 800}
@font-face{font-family:'Gowun Batang';src:url('../fonts/GowunBatang-Regular.ttf');font-weight:400}
@font-face{font-family:'Gowun Batang';src:url('../fonts/GowunBatang-Bold.ttf');font-weight:700}

body{margin:0}
.ln{--lh:58px;padding:0;font-family:'Gowun Batang',serif;font-size:34px;font-weight:400;color:#1a0bd0;line-height:var(--lh);background-image:linear-gradient(to bottom,transparent calc(var(--lh) - 2px),#c9c7de 0);background-size:100% var(--lh)}
.pill{height:84px;border-radius:42px;padding:0 34px;font-family:inherit;font-size:30px;font-weight:800;display:inline-flex;align-items:center;gap:12px;cursor:pointer;box-sizing:border-box}
.pri{background:#1a0bd0;color:#ffffff;border:2.5px solid #1a0bd0}
.sec{background:transparent;color:#1a0bd0;border:2.5px solid #1a0bd0}
</style></head><body style='margin:0'>
<div style="width:960px;height:1280px;box-sizing:border-box;background:#efefef;font-family:'Asta Sans','Noto Sans KR',sans-serif;color:#1a0bd0;display:grid;grid-template-columns:72px minmax(0,1fr);overflow:hidden">

  <div style="border-right:2px solid #1a0bd0;display:flex;flex-direction:column;justify-content:space-between;align-items:center;padding:36px 0 28px">
    <span style="writing-mode:vertical-rl;font-size:22px;font-weight:800">김○○의 자서전</span>
    <div style="display:flex;flex-direction:column;align-items:center;gap:16px">
      <span style="writing-mode:vertical-rl;font-family:'Gowun Batang',serif;font-size:21px;font-weight:700;letter-spacing:.03em">Autography</span>
      <a href="Settings.html" aria-label="환경설정" style="width:52px;height:52px;border-radius:26px;border:2px solid #1a0bd0;display:flex;align-items:center;justify-content:center;box-sizing:border-box"><svg width="26" height="26" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="3.4" fill="none" stroke="#1a0bd0" stroke-width="2"></circle><path d="M12 2.5v3M12 18.5v3M2.5 12h3M18.5 12h3M5.3 5.3l2.1 2.1M16.6 16.6l2.1 2.1M5.3 18.7l2.1-2.1M16.6 7.4l2.1-2.1" stroke="#1a0bd0" stroke-width="2" stroke-linecap="round"></path></svg></a>
    </div>
  </div>

  <div style="display:flex;flex-direction:column;min-width:0;min-height:0">
    <div style="display:flex;justify-content:space-between;align-items:center;gap:20px;padding:32px 32px 28px 32px;border-bottom:2px solid #1a0bd0;flex:none">
      <div style="display:flex;flex-direction:column;gap:12px;min-width:0"><span style="align-self: flex-start; font-size: 20px; font-weight: 700; border: 2px solid rgb(26, 11, 208); border-radius: 22px; padding: 4px 16px; white-space: nowrap">정차 중 · P</span>
        <span style="font-size: 52px; font-weight: 800; line-height: 1.1">2장 첫 차 · 원고</span>
      </div>
      <a href="Main.html" style="flex:none;height:100px;box-sizing:border-box;padding:0 36px 0 26px;border-radius:50px;border:2.5px solid #1a0bd0;background:transparent;color:#1a0bd0;display:flex;align-items:center;gap:10px;font-family:inherit;font-size:34px;font-weight:800;text-decoration:none;cursor:pointer"><svg width="34" height="34" viewBox="0 0 24 24" aria-hidden="true"><path d="M15 5l-7 7 7 7" fill="none" stroke="#1a0bd0" stroke-width="2.6"></path></svg>홈</a>
    </div>

    <div style="flex:1;min-height:0;overflow:hidden;padding:8px 32px 0 32px;display:flex;flex-direction:column">
      <div style="display:flex;align-items:center;gap:12px;padding:16px 0 6px">
        <svg width="28" height="28" viewBox="0 0 24 24" aria-hidden="true"><path d="M7 4v9M7 4l3 3M7 4L4 7M12 20h8M12 15h8" fill="none" stroke="#4a44a6" stroke-width="2"></path></svg>
        <span style="font-size:24px;font-weight:600;color:#4a44a6">고칠 부분을 길게 눌러 고르면, 말로 고칠 수 있어요</span>
      </div>
      <p class="ln" style="margin:0">스물아홉에 처음 운전대를 잡았습니다. 새벽 네 시가 이렇게 조용한 줄 몰랐어요.</p>
      <div style="position:relative">
        <p class="ln" style="margin:0">시동을 걸자마자 손이 떨렸죠. <span style="background:#1a0bd0;color:#ffffff;padding:2px 6px;border-radius:6px">1988년 겨울</span>, 아내가 보온병에 커피를 타 줬습니다.</p>
        <div style="position:absolute;left:250px;top:-86px;z-index:2;display:flex;gap:12px">
          <button class="pill pri" style="height:76px;font-size:27px;padding:0 26px;box-shadow:0 6px 16px rgba(26,11,208,.16)"><svg width="28" height="28" viewBox="0 0 24 24" aria-hidden="true"><rect x="9" y="3" width="6" height="11" rx="3" fill="#ffffff"></rect><path d="M6 11a6 6 0 0 0 12 0M12 17v4" stroke="#ffffff" stroke-width="2" fill="none"></path></svg>말로 고치기</button>
          <button class="pill sec" style="height:76px;font-size:27px;padding:0 26px;background:#f8f8f8;box-shadow:0 6px 16px rgba(26,11,208,.12)">다시 듣기</button>
          <button class="pill sec" style="height:76px;font-size:27px;padding:0 26px;background:#f8f8f8;box-shadow:0 6px 16px rgba(26,11,208,.12)">지우기</button>
        </div>
      </div>

      <p class="ln" style="margin:0">첫 손님은 시장에 가던 아주머니였어요. “기사 양반, 첫날이지?” 하시더군요.</p>

      <div style="display:flex;flex-direction:column;gap:20px;padding:28px 0 28px;border-bottom:2.5px dashed #1a0bd0">
        <p style="margin:0;font-family:'Gowun Batang',serif;font-size:36px;font-weight:700;line-height:1.3;letter-spacing:-.01em">여기서부터 이어서 써 볼까요?</p>
        <div style="display:flex;gap:16px;flex-wrap:wrap">
          <a href="Interview.html" class="pill pri" style="text-decoration:none"><svg width="28" height="28" viewBox="0 0 24 24" aria-hidden="true"><path d="M4 20h4l11-11-4-4L4 16z" fill="none" stroke="#ffffff" stroke-width="2.4" stroke-linejoin="round"></path></svg>이어쓰기</a>
          <a href="Player.html" class="pill sec" style="text-decoration:none"><svg width="26" height="26" viewBox="0 0 24 24" aria-hidden="true"><path d="M8 5l11 7-11 7z" fill="#1a0bd0"></path></svg>처음부터 듣기</a>
        </div>
      </div>
      <span style="padding-top:14px;font-size:20px;font-weight:600;color:#4a44a6">예시 원고</span>
    </div>
  </div>
</div>
</body></html>
