<!doctype html><html lang=ko><head><meta charset=utf-8><title>환경설정</title><style>@font-face{font-family:'Asta Sans';src:url('../fonts/AstaSans[wght].ttf');font-weight:300 800}
@font-face{font-family:'Gowun Batang';src:url('../fonts/GowunBatang-Regular.ttf');font-weight:400}
@font-face{font-family:'Gowun Batang';src:url('../fonts/GowunBatang-Bold.ttf');font-weight:700}

body{margin:0}
.sec{font-size:24px;font-weight:800;letter-spacing:.04em;color:#4a44a6;padding:26px 0 10px}
.book{display:flex;align-items:center;gap:20px;padding:22px 0;border-bottom:2px solid #c4c3d8}
.sp{width:48px;height:120px;flex:none;border:2px solid #1a0bd0;box-sizing:border-box;display:flex;align-items:center;justify-content:center;background:#f7f7f7}
.sp span{writing-mode:vertical-rl;font-size:13px;font-weight:800}
.act{height:68px;border-radius:34px;border:2.5px solid #1a0bd0;background:transparent;color:#1a0bd0;font-family:inherit;font-size:24px;font-weight:800;padding:0 22px;display:inline-flex;align-items:center;gap:8px;cursor:pointer;white-space:nowrap}
.icb{width:68px;height:68px;border-radius:34px;border:2.5px solid #1a0bd0;background:transparent;display:flex;align-items:center;justify-content:center;padding:0;flex:none;cursor:pointer}
.opt{display:flex;align-items:center;gap:16px;min-height:92px;border-bottom:2px solid #c4c3d8}
.opt b{flex:1;font-size:28px;font-weight:700}
.opt span{font-size:24px;font-weight:600;color:#4a44a6}
.tg{width:84px;height:48px;border-radius:24px;background:#1a0bd0;position:relative;flex:none}
.tg::after{content:"";position:absolute;right:6px;top:6px;width:36px;height:36px;border-radius:18px;background:#ffffff}
.tg.off{background:#c4c3d8}
.tg.off::after{right:auto;left:6px}
</style></head><body style='margin:0'>
<div style="width:960px;height:1280px;box-sizing:border-box;background:#efefef;font-family:'Asta Sans','Noto Sans KR',sans-serif;color:#1a0bd0;display:grid;grid-template-columns:72px minmax(0,1fr);overflow:hidden">

  <div style="border-right:2px solid #1a0bd0;display:flex;flex-direction:column;justify-content:space-between;align-items:center;padding:36px 0 28px">
    <span style="writing-mode:vertical-rl;font-size:22px;font-weight:800">김○○의 자서전</span>
    <div style="display:flex;flex-direction:column;align-items:center;gap:16px">
      <span style="writing-mode:vertical-rl;font-family:'Gowun Batang',serif;font-size:21px;font-weight:700;letter-spacing:.03em">Autography</span>
      <span aria-label="환경설정 (현재 화면)" style="width:52px;height:52px;border-radius:26px;background:#1a0bd0;display:flex;align-items:center;justify-content:center"><svg width="26" height="26" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="3.4" fill="none" stroke="#ffffff" stroke-width="2"/><path d="M12 2.5v3M12 18.5v3M2.5 12h3M18.5 12h3M5.3 5.3l2.1 2.1M16.6 16.6l2.1 2.1M5.3 18.7l2.1-2.1M16.6 7.4l2.1-2.1" stroke="#ffffff" stroke-width="2" stroke-linecap="round"/></svg></span>
    </div>
  </div>

  <div style="display:flex;flex-direction:column;min-width:0">
    <div style="display:flex;justify-content:space-between;align-items:center;gap:20px;padding:32px 32px 26px;border-bottom:2px solid #1a0bd0">
      <div style="display:flex;flex-direction:column;gap:12px">
        <span style="align-self:flex-start;font-size:20px;font-weight:700;border:2px solid #1a0bd0;border-radius:22px;padding:4px 16px">정차 중 · P</span>
        <span style="font-size:52px;font-weight:800">환경설정</span>
      </div>
      <a href="Main.html" style="flex:none;height:100px;box-sizing:border-box;padding:0 36px 0 26px;border-radius:50px;border:2.5px solid #1a0bd0;color:#1a0bd0;display:flex;align-items:center;gap:10px;font-size:34px;font-weight:800;text-decoration:none"><svg width="34" height="34" viewBox="0 0 24 24" aria-hidden="true"><path d="M15 5l-7 7 7 7" fill="none" stroke="#1a0bd0" stroke-width="2.6"/></svg>홈</a>
    </div>

    <div style="padding:0 32px;display:flex;flex-direction:column">
      <div class="sec">내 자서전</div>
      <div class="book">
        <span style="flex:1;min-width:0;display:flex;flex-direction:column;gap:4px">
          <span style="font-size:30px;font-weight:800">김○○의 자서전</span>
          <span style="font-size:22px;font-weight:600;color:#4a44a6">2 / 12 챕터 · 지금 쓰는 중</span>
        </span>
        <button class="act" aria-label="김○○의 자서전 출판 신청"><svg width="24" height="24" viewBox="0 0 24 24" aria-hidden="true"><path d="M5 4h10a4 4 0 0 1 4 4v12H9a4 4 0 0 1-4-4z M9 4v16" fill="none" stroke="#1a0bd0" stroke-width="2"/></svg>출판 신청</button>
        <button class="icb" aria-label="김○○의 자서전 제목 바꾸기"><svg width="26" height="26" viewBox="0 0 24 24" aria-hidden="true"><path d="M4 20h4l11-11-4-4L4 16z" fill="none" stroke="#1a0bd0" stroke-width="2.2" stroke-linejoin="round"/></svg></button>
        <button class="icb" aria-label="김○○의 자서전 삭제"><svg width="26" height="26" viewBox="0 0 24 24" aria-hidden="true"><path d="M5 7h14M10 7V4h4v3M7 7l1 13h8l1-13" fill="none" stroke="#1a0bd0" stroke-width="2"/></svg></button>
      </div>
      <div class="book">
        <span style="flex:1;min-width:0;display:flex;flex-direction:column;gap:4px">
          <span style="font-size:30px;font-weight:800">우리 가게 이야기</span>
          <span style="font-size:22px;font-weight:600;color:#4a44a6">1 / 12 챕터 · 3주 전</span>
        </span>
        <button class="act">이 자서전 쓰기</button>
        <button class="icb" aria-label="우리 가게 이야기 제목 바꾸기"><svg width="26" height="26" viewBox="0 0 24 24" aria-hidden="true"><path d="M4 20h4l11-11-4-4L4 16z" fill="none" stroke="#1a0bd0" stroke-width="2.2" stroke-linejoin="round"/></svg></button>
        <button class="icb" aria-label="우리 가게 이야기 삭제"><svg width="26" height="26" viewBox="0 0 24 24" aria-hidden="true"><path d="M5 7h14M10 7V4h4v3M7 7l1 13h8l1-13" fill="none" stroke="#1a0bd0" stroke-width="2"/></svg></button>
      </div>
      <a href="Onboarding.html" style="display:flex;align-items:center;gap:14px;height:96px;margin-top:18px;box-sizing:border-box;border:2.5px dashed #1a0bd0;border-radius:48px;justify-content:center;font-size:30px;font-weight:800;color:#1a0bd0;text-decoration:none"><svg width="32" height="32" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 5v14M5 12h14" stroke="#1a0bd0" stroke-width="2.6"/></svg>새로운 자서전 시작하기</a>

      <div class="sec" style="padding-top:34px">오토</div>
      <div class="opt"><b>부르는 이름</b><span>○○님</span></div>
      <div class="opt"><b>오토가 먼저 말 걸기</b><span>긴 직진·정체 15분</span><i class="tg" aria-label="켜짐"></i></div>
      <div class="opt"><b>알림 멜로디</b><i class="tg" aria-label="켜짐"></i></div>
      <div class="opt" style="border-bottom:none"><b>오토그래피 라디오에 공개</b><span>나중에</span><i class="tg off" aria-label="꺼짐"></i></div>
    </div>
  </div>
</div>
</body></html>
